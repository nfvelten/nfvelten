name: open source section

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate
        env:
          GH_TOKEN: ${{ secrets.OSS_TOKEN || github.token }}
        run: python3 scripts/oss.py
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: refresh open source section" README.md
            git push
          fi
